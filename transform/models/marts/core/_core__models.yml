version: 2

models:
  - name: dim_date
    description: Calendar 2022-2026 with Indian fiscal year (Apr-Mar) and marketplace sale windows.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: fiscal_quarter
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false

  - name: dim_customers
    description: >
      One row per customer with geography (conformed via reference seeds), acquisition
      channel, lifetime value and a lifecycle status as of `var('as_of_date')`.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - accepted_values:
              values: ["North", "South", "East", "West", "Central", "Northeast"]
      - name: city_tier
        data_tests:
          - accepted_values:
              values: ["Tier 1", "Tier 2", "Tier 3"]
      - name: lifecycle_status
        description: "{{ doc('lifecycle_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              values: ["never_purchased", "active", "at_risk", "churned"]
      - name: lifetime_revenue
        description: Recognised revenue (delivered orders, incl. shipping) over the customer's lifetime.
        data_tests: [is_non_negative]
      - name: cohort_month
        description: Month of the customer's first order. Null if they never purchased.

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: list_margin_pct
        data_tests:
          - value_between: {min_value: -1, max_value: 1}

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: fct_orders
    description: "{{ doc('fct_orders') }}"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: primary_seller_id
        data_tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: order_total
        data_tests: [not_null, is_non_negative]
      - name: recognized_revenue
        description: "{{ doc('recognized_revenue') }}"
        data_tests: [not_null, is_non_negative]
      - name: customer_order_number
        data_tests: [not_null]
      - name: review_rating
        data_tests:
          - value_between: {min_value: 1, max_value: 5}

  - name: fct_order_items
    description: One row per order line. Incremental model (delete+insert on `order_item_sk`).
    columns:
      - name: order_item_sk
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: discount_rate
        data_tests:
          - value_between: {min_value: 0, max_value: 1}
