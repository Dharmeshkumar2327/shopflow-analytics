version: 2

exposures:
  - name: shopflow_executive_dashboard
    label: ShopFlow Executive Dashboard
    type: dashboard
    maturity: high
    url: http://localhost:8501
    description: >
      Streamlit dashboard (`dashboard/app.py`) used for the monthly business review:
      revenue & margin trends, cohort retention, RFM segments, channel CAC / LTV,
      delivery SLAs and seller tiers.
    depends_on:
      - ref('fin_monthly_kpis')
      - ref('fin_payment_method_mix')
      - ref('fin_category_performance')
      - ref('mkt_customer_cohorts')
      - ref('mkt_rfm_segments')
      - ref('mkt_channel_performance')
      - ref('ops_delivery_performance')
      - ref('ops_seller_scorecard')
    owner:
      name: Dharmesh Kumar
